# Hostinger VPS foundation. Only Caddy has a host-facing port; PostgreSQL and
# Redis are isolated on the internal Docker network. Services that must make
# outbound requests join the separate egress network as well; neither database
# nor Redis ever join an egress-capable network or publish a host port.
name: real-estate-monitor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bot/services/db/migrations:/migrations:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Keep this loopback-only until a DNS name and TLS policy are configured.
      - "127.0.0.1:${CADDY_HTTP_PORT:-8080}:8080"
      # Public HTTPS for the operator live browser (/live/* only; everything
      # else is 404). Loopback until LIVE_VIEW_BIND=0.0.0.0 is set on purpose.
      - "${LIVE_VIEW_BIND:-127.0.0.1}:80:80"
      - "${LIVE_VIEW_BIND:-127.0.0.1}:443:443"
    environment:
      LIVE_VIEW_DOMAIN: ${LIVE_VIEW_DOMAIN:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]

  telegram:
    build:
      context: .
      dockerfile: docker/telegram-control.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
      # Empty is allowed but refuses every state-changing command.
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      # Auto mode default (owners switch it with /auto) and extra auto-operators.
      AUTO_MODE: ${AUTO_MODE:-off}
      TELEGRAM_AUTO_OPERATOR_IDS: ${TELEGRAM_AUTO_OPERATOR_IDS:-}
      # Tunables read by bot/control_plane/settings.py; defaults match it.
      TELEGRAM_CONFIRMATION_TTL_SECONDS: ${TELEGRAM_CONFIRMATION_TTL_SECONDS:-300}
      ORCHESTRA_COMMAND_LEASE_SECONDS: ${ORCHESTRA_COMMAND_LEASE_SECONDS:-30}
      ORCHESTRA_POLL_SECONDS: ${ORCHESTRA_POLL_SECONDS:-1}
      ORCHESTRA_STALE_BATCH_SECONDS: ${ORCHESTRA_STALE_BATCH_SECONDS:-900}
      SAFETY_MAX_FACEBOOK_BATCHES_PER_DAY: ${SAFETY_MAX_FACEBOOK_BATCHES_PER_DAY:-6}
      SAFETY_MAX_FACEBOOK_GROUPS_PER_DAY: ${SAFETY_MAX_FACEBOOK_GROUPS_PER_DAY:-60}
      SAFETY_MAX_RUNS_PER_DAY: ${SAFETY_MAX_RUNS_PER_DAY:-40}
      SAFETY_BREAKER_FAILURES: ${SAFETY_BREAKER_FAILURES:-3}
      SAFETY_BREAKER_CHALLENGES: ${SAFETY_BREAKER_CHALLENGES:-2}
      SAFETY_BREAKER_WINDOW_HOURS: ${SAFETY_BREAKER_WINDOW_HOURS:-6}
      # Voice transcription via OpenRouter, reusing the analysis pipeline's key.
      # Without the key the bot still starts and refuses voice notes.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-openrouter}
      STT_MODEL: ${STT_MODEL:-openai/whisper-large-v3-turbo}
      STT_MAX_AUDIO_BYTES: ${STT_MAX_AUDIO_BYTES:-20971520}
      STT_MAX_AUDIO_SECONDS: ${STT_MAX_AUDIO_SECONDS:-300}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-60}
      # AI task understanding in intake (same key); without it tasks are read by rules.
      OPENROUTER_INTAKE_MODEL: ${OPENROUTER_INTAKE_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_INTAKE_TIMEOUT_SECONDS: ${OPENROUTER_INTAKE_TIMEOUT_SECONDS:-20}
      # The interviewer: one AI call per user message until the task is fully specified (same key).
      OPENROUTER_INTERVIEW_MODEL: ${OPENROUTER_INTERVIEW_MODEL:-anthropic/claude-sonnet-4.5}
      OPENROUTER_INTERVIEW_TIMEOUT_SECONDS: ${OPENROUTER_INTERVIEW_TIMEOUT_SECONDS:-30}
      INTERVIEW_MAX_ROUNDS: ${INTERVIEW_MAX_ROUNDS:-10}
      # Live browser for Facebook logins/checkpoints (bot/control_plane/live_view.py).
      # Empty LIVE_VIEW_PUBLIC_URL keeps the feature off.
      LIVE_VIEW_PUBLIC_URL: ${LIVE_VIEW_PUBLIC_URL:-}
      LIVE_VIEW_OPEN_MINUTES: ${LIVE_VIEW_OPEN_MINUTES:-20}
      LIVE_VIEW_REQUEST_MINUTES: ${LIVE_VIEW_REQUEST_MINUTES:-60}
      LIVE_VIEW_POLL_SECONDS: ${LIVE_VIEW_POLL_SECONDS:-60}
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
    # `backend` reaches PostgreSQL/Redis, the browser API and Caddy; `egress`
    # is required for Telegram's long polling API and OpenRouter. It publishes
    # no host port: the live-view gate on :8081 is reached only through Caddy.
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  browser:
    build:
      context: .
      dockerfile: docker/browser-session.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      BROWSER_PROFILE_ROOT: /profiles
      BROWSER_SCREENSHOT_ROOT: /screenshots
      BROWSER_LEASE_SECONDS: ${BROWSER_LEASE_SECONDS:-120}
      BROWSER_LEASE_RENEW_SECONDS: ${BROWSER_LEASE_RENEW_SECONDS:-30}
      BROWSER_IDLE_SECONDS: ${BROWSER_IDLE_SECONDS:-300}
    volumes:
      - browser_profiles:/profiles
      - browser_screenshots:/screenshots
    # No published ports, including noVNC: during an operator login session
    # (scripts/browser_login.sh) it is reached over an SSH tunnel to this
    # container's bridge address, and nothing listens outside a session.
    # Chromium needs outbound HTTPS while the session API remains reachable
    # only by services on the private backend network.
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    shm_size: 1gb

  facebook-collector:
    profiles: [collector]
    build:
      context: .
      dockerfile: docker/facebook-collector.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      # Validated by the one-shot worker at runtime; keeping this optional here
      # lets ordinary `docker compose config` and non-collector services start.
      FACEBOOK_BATCH_ID: ${FACEBOOK_BATCH_ID:-}
      FACEBOOK_COLLECTOR_MAX_GROUPS: ${FACEBOOK_COLLECTOR_MAX_GROUPS:-20}
      FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP: ${FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP:-15}
      FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS: ${FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS:-90}
      FACEBOOK_COLLECTOR_PAUSE_MIN_SECONDS: ${FACEBOOK_COLLECTOR_PAUSE_MIN_SECONDS:-4}
      FACEBOOK_COLLECTOR_PAUSE_MAX_SECONDS: ${FACEBOOK_COLLECTOR_PAUSE_MAX_SECONDS:-9}
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  facebook-runner:
    # Same image and limits as facebook-collector, but long-running: it starts
    # only batches that a verification Resume requeued (collector_launch_requests),
    # one at a time. Batches queued by /run stay manual.
    build:
      context: .
      dockerfile: docker/facebook-collector.Dockerfile
    command: ["python", "-m", "bot.facebook_collector.runner"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      FACEBOOK_COLLECTOR_MAX_GROUPS: ${FACEBOOK_COLLECTOR_MAX_GROUPS:-20}
      FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP: ${FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP:-15}
      FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS: ${FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS:-90}
      FACEBOOK_COLLECTOR_PAUSE_MIN_SECONDS: ${FACEBOOK_COLLECTOR_PAUSE_MIN_SECONDS:-4}
      FACEBOOK_COLLECTOR_PAUSE_MAX_SECONDS: ${FACEBOOK_COLLECTOR_PAUSE_MAX_SECONDS:-9}
      FACEBOOK_COLLECTOR_RUNNER_POLL_SECONDS: ${FACEBOOK_COLLECTOR_RUNNER_POLL_SECONDS:-15}
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  agent-reach:
    # Controlled, one-shot public-page reader. It is deliberately profile-gated
    # so upstream Agent Reach is never installed or invoked by this stack.
    profiles: [agent-reach]
    build:
      context: .
      dockerfile: docker/agent-reach.Dockerfile
    depends_on:
      browser:
        condition: service_started
    environment:
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      AGENT_REACH_TASK_JSON: ${AGENT_REACH_TASK_JSON:-}
      AGENT_REACH_MAX_PAGES: ${AGENT_REACH_MAX_PAGES:-5}
      AGENT_REACH_MAX_EXECUTION_SECONDS: ${AGENT_REACH_MAX_EXECUTION_SECONDS:-120}
      AGENT_REACH_PAGE_TIMEOUT_SECONDS: ${AGENT_REACH_PAGE_TIMEOUT_SECONDS:-30}
      # Must remain false: no upstream CLI/shell/tool installation is allowed.
      AGENT_REACH_UPSTREAM_ENABLED: "false"
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  scrapling-connector:
    # One-shot HTTP-first public website reader. It has no browser profile,
    # browser API token, shell tool, or crawler capability.
    profiles: [scrapling]
    build:
      context: .
      dockerfile: docker/scrapling-connector.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SCRAPLING_RUN_ID: ${SCRAPLING_RUN_ID:-}
      SCRAPLING_CONNECTOR_MAX_RUNTIME_SECONDS: ${SCRAPLING_CONNECTOR_MAX_RUNTIME_SECONDS:-45}
      SCRAPLING_CONNECTOR_REQUEST_TIMEOUT_SECONDS: ${SCRAPLING_CONNECTOR_REQUEST_TIMEOUT_SECONDS:-20}
      SCRAPLING_CONNECTOR_MAX_CONTENT_BYTES: ${SCRAPLING_CONNECTOR_MAX_CONTENT_BYTES:-1500000}
      SCRAPLING_CONNECTOR_MAX_CONTENT_CHARS: ${SCRAPLING_CONNECTOR_MAX_CONTENT_CHARS:-120000}
      SCRAPLING_CONNECTOR_USER_AGENT: ${SCRAPLING_CONNECTOR_USER_AGENT:-RealEstateResearchBot/0.1}
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  analysis-pipeline:
    # One-shot, DB-backed analysis worker. It only receives bounded evidence
    # selected by deterministic filters before OpenRouter is called.
    profiles: [analysis]
    build:
      context: .
      dockerfile: docker/analysis-pipeline.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_ANALYSIS_MODEL: ${OPENROUTER_ANALYSIS_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_ANALYSIS_TIMEOUT_SECONDS: ${OPENROUTER_ANALYSIS_TIMEOUT_SECONDS:-30}
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-10}
      ANALYSIS_TELEGRAM_CHAT_ID: ${ANALYSIS_TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  # --- Long-running workers: each takes only work that a confirmed Telegram
  # command (or a verification Resume) queued in PostgreSQL, one item at a
  # time, with the same limits as its one-shot service above.

  agent-reach-worker:
    build:
      context: .
      dockerfile: docker/agent-reach.Dockerfile
    command: ["python", "-m", "bot.agent_reach.worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      AGENT_REACH_MAX_PAGES: ${AGENT_REACH_MAX_PAGES:-5}
      AGENT_REACH_MAX_EXECUTION_SECONDS: ${AGENT_REACH_MAX_EXECUTION_SECONDS:-120}
      AGENT_REACH_PAGE_TIMEOUT_SECONDS: ${AGENT_REACH_PAGE_TIMEOUT_SECONDS:-30}
      AGENT_REACH_POLL_SECONDS: ${AGENT_REACH_POLL_SECONDS:-15}
      AGENT_REACH_UPSTREAM_ENABLED: "false"
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  scrapling-worker:
    build:
      context: .
      dockerfile: docker/scrapling-connector.Dockerfile
    command: ["python", "-m", "bot.scrapling_connector.worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SCRAPLING_CONNECTOR_MAX_RUNTIME_SECONDS: ${SCRAPLING_CONNECTOR_MAX_RUNTIME_SECONDS:-45}
      SCRAPLING_CONNECTOR_REQUEST_TIMEOUT_SECONDS: ${SCRAPLING_CONNECTOR_REQUEST_TIMEOUT_SECONDS:-20}
      SCRAPLING_CONNECTOR_MAX_CONTENT_BYTES: ${SCRAPLING_CONNECTOR_MAX_CONTENT_BYTES:-1500000}
      SCRAPLING_CONNECTOR_MAX_CONTENT_CHARS: ${SCRAPLING_CONNECTOR_MAX_CONTENT_CHARS:-120000}
      SCRAPLING_CONNECTOR_USER_AGENT: ${SCRAPLING_CONNECTOR_USER_AGENT:-RealEstateResearchBot/0.1}
      SCRAPLING_POLL_SECONDS: ${SCRAPLING_POLL_SECONDS:-15}
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  analysis-worker:
    # Idle without OPENROUTER_API_KEY; digests need ANALYSIS_TELEGRAM_CHAT_ID.
    build:
      context: .
      dockerfile: docker/analysis-pipeline.Dockerfile
    command: ["python", "-m", "bot.analysis_pipeline.main", "--serve"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_ANALYSIS_MODEL: ${OPENROUTER_ANALYSIS_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_ANALYSIS_TIMEOUT_SECONDS: ${OPENROUTER_ANALYSIS_TIMEOUT_SECONDS:-30}
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-10}
      ANALYSIS_POLL_SECONDS: ${ANALYSIS_POLL_SECONDS:-60}
      ANALYSIS_CLAIM_SECONDS: ${ANALYSIS_CLAIM_SECONDS:-300}
      ANALYSIS_TELEGRAM_CHAT_ID: ${ANALYSIS_TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  reduction-worker:
    # Hybrid pipeline SA-2 Reduction agents (docs/HYBRID_AGENTS.md), SHADOW mode:
    # Claude extracts each campaign post, Jev decides at once, the gate files it;
    # every decision is stored in agent_reductions and nothing is sent. Idle until
    # AGENT_REDUCTION_ENABLED=true; idle too (one log line) if OpenRouter does not list a model.
    # Scale with: docker compose up -d --scale reduction-worker=2
    build:
      context: .
      dockerfile: docker/campaign-runner.Dockerfile
    command: ["python", "-m", "bot.agents.reduction"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_REDUCTION_ENABLED: ${AGENT_REDUCTION_ENABLED:-false}
      OPENROUTER_CLAUDE_MODEL: ${OPENROUTER_CLAUDE_MODEL:-anthropic/claude-opus-5.5}
      OPENROUTER_JEV_MODEL: ${OPENROUTER_JEV_MODEL:-~typesafe/jev-latest}
      AGENT_REDUCTION_CONCURRENCY: ${AGENT_REDUCTION_CONCURRENCY:-4}
      AGENT_REDUCTION_BATCH: ${AGENT_REDUCTION_BATCH:-5}
      AGENT_REDUCTION_POLL_SECONDS: ${AGENT_REDUCTION_POLL_SECONDS:-15}
      AGENT_REDUCTION_MAX_CALLS_PER_DAY: ${AGENT_REDUCTION_MAX_CALLS_PER_DAY:-1000}
      AGENT_REDUCTION_TIMEOUT_SECONDS: ${AGENT_REDUCTION_TIMEOUT_SECONDS:-45}
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  campaign-runner:
    # Drives /campaign goals: discovery, then windows of at most 20 groups as
    # ordinary Facebook batches that facebook-runner executes (same quotas and
    # breakers as /run), live status and findings in the campaign's chat.
    # In parallel, its website stage (bot/web_search) searches the web for
    # every campaign through the internal `searxng` service and reads the
    # public listing pages it finds (docs/WEB_SEARCH.md): Scrapling reads each
    # site's own JSON-LD (price, area, address), and a page drawn by JavaScript
    # is read once more in the `browser` service (the Agent Reach path).
    build:
      context: .
      dockerfile: docker/campaign-runner.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
      # Owners see technical campaign status; everyone else user-safe labels.
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP: ${FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP:-15}
      FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS: ${FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS:-90}
      CAMPAIGN_POLL_SECONDS: ${CAMPAIGN_POLL_SECONDS:-10}
      CAMPAIGN_WINDOW_COOLDOWN_SECONDS: ${CAMPAIGN_WINDOW_COOLDOWN_SECONDS:-120}
      CAMPAIGN_ANALYSIS_GRACE_SECONDS: ${CAMPAIGN_ANALYSIS_GRACE_SECONDS:-600}
      CAMPAIGN_REFUSAL_RETRY_SECONDS: ${CAMPAIGN_REFUSAL_RETRY_SECONDS:-300}
      SAFETY_MAX_FACEBOOK_BATCHES_PER_DAY: ${SAFETY_MAX_FACEBOOK_BATCHES_PER_DAY:-6}
      SAFETY_MAX_FACEBOOK_GROUPS_PER_DAY: ${SAFETY_MAX_FACEBOOK_GROUPS_PER_DAY:-60}
      SAFETY_MAX_RUNS_PER_DAY: ${SAFETY_MAX_RUNS_PER_DAY:-40}
      SAFETY_BREAKER_FAILURES: ${SAFETY_BREAKER_FAILURES:-3}
      SAFETY_BREAKER_CHALLENGES: ${SAFETY_BREAKER_CHALLENGES:-2}
      SAFETY_BREAKER_WINDOW_HOURS: ${SAFETY_BREAKER_WINDOW_HOURS:-6}
      # Website stage (bot/web_search/settings.py; defaults match it).
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_SEARXNG_URL: http://searxng:8080
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_WEB_QUERY_MODEL: ${OPENROUTER_WEB_QUERY_MODEL:-openai/gpt-4o-mini}
      WEB_SEARCH_QUERIES_PER_ROUND: ${WEB_SEARCH_QUERIES_PER_ROUND:-12}
      WEB_SEARCH_MAX_QUERIES_PER_CAMPAIGN: ${WEB_SEARCH_MAX_QUERIES_PER_CAMPAIGN:-40}
      WEB_SEARCH_RESULTS_PER_QUERY: ${WEB_SEARCH_RESULTS_PER_QUERY:-10}
      WEB_SEARCH_MAX_PAGES_PER_CAMPAIGN: ${WEB_SEARCH_MAX_PAGES_PER_CAMPAIGN:-150}
      WEB_SEARCH_MAX_PAGES_PER_HOST: ${WEB_SEARCH_MAX_PAGES_PER_HOST:-30}
      WEB_SEARCH_MAX_LINKS_PER_INDEX: ${WEB_SEARCH_MAX_LINKS_PER_INDEX:-10}
      WEB_SEARCH_MAX_PAGES_PER_DAY: ${WEB_SEARCH_MAX_PAGES_PER_DAY:-1500}
      WEB_SEARCH_MAX_QUERIES_PER_DAY: ${WEB_SEARCH_MAX_QUERIES_PER_DAY:-300}
      WEB_SEARCH_MAX_MINUTES_PER_CAMPAIGN: ${WEB_SEARCH_MAX_MINUTES_PER_CAMPAIGN:-240}
      WEB_SEARCH_HOST_INTERVAL_SECONDS: ${WEB_SEARCH_HOST_INTERVAL_SECONDS:-5}
      WEB_SEARCH_BLOCKED_HOSTS: ${WEB_SEARCH_BLOCKED_HOSTS:-}
      WEB_SEARCH_COVER_PORTALS: ${WEB_SEARCH_COVER_PORTALS:-true}
      WEB_SEARCH_POLL_SECONDS: ${WEB_SEARCH_POLL_SECONDS:-15}
      WEB_SEARCH_RENDER_ENABLED: ${WEB_SEARCH_RENDER_ENABLED:-true}
      WEB_SEARCH_RENDER_TIMEOUT_SECONDS: ${WEB_SEARCH_RENDER_TIMEOUT_SECONDS:-30}
      WEB_SEARCH_MAX_RENDERS_PER_CAMPAIGN: ${WEB_SEARCH_MAX_RENDERS_PER_CAMPAIGN:-15}
      # Optional outbound proxy/VPN for page fetches (and SearXNG, below).
      WEB_SEARCH_PROXY_URL: ${WEB_SEARCH_PROXY_URL:-}
      # Social network search (bot/social_search): every listed network where a profile is logged in; "off" = none.
      SOCIAL_SEARCH_PLATFORMS: ${SOCIAL_SEARCH_PLATFORMS:-instagram,tiktok,linkedin}
      SOCIAL_SEARCH_QUERIES_PER_DAY: ${SOCIAL_SEARCH_QUERIES_PER_DAY:-20}
      SOCIAL_SEARCH_ITEMS_PER_QUERY: ${SOCIAL_SEARCH_ITEMS_PER_QUERY:-12}
      SOCIAL_SEARCH_QUERIES_PER_ROUND: ${SOCIAL_SEARCH_QUERIES_PER_ROUND:-4}
      SOCIAL_SEARCH_MAX_ROUNDS: ${SOCIAL_SEARCH_MAX_ROUNDS:-3}
      SOCIAL_SEARCH_PAUSE_SECONDS: ${SOCIAL_SEARCH_PAUSE_SECONDS:-120}
      SOCIAL_SEARCH_JITTER_SECONDS: ${SOCIAL_SEARCH_JITTER_SECONDS:-90}
      SOCIAL_SEARCH_OPEN_POSTS_PER_QUERY: ${SOCIAL_SEARCH_OPEN_POSTS_PER_QUERY:-4}
      SOCIAL_SEARCH_SCROLLS: ${SOCIAL_SEARCH_SCROLLS:-2}
      SOCIAL_SEARCH_QUERY_REUSE_DAYS: ${SOCIAL_SEARCH_QUERY_REUSE_DAYS:-7}
      SOCIAL_SEARCH_RATE_LIMIT_COOLDOWN_HOURS: ${SOCIAL_SEARCH_RATE_LIMIT_COOLDOWN_HOURS:-6}
      SOCIAL_SEARCH_POLL_SECONDS: ${SOCIAL_SEARCH_POLL_SECONDS:-15}
      CAMPAIGN_SOCIAL_GRACE_SECONDS: ${CAMPAIGN_SOCIAL_GRACE_SECONDS:-1800}
      OPENROUTER_SOCIAL_MODEL: ${OPENROUTER_SOCIAL_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_MATCH_MODEL: ${OPENROUTER_MATCH_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_MATCH_TIMEOUT_SECONDS: ${OPENROUTER_MATCH_TIMEOUT_SECONDS:-15}
      CAMPAIGN_RELEVANCE_MAX_CALLS: ${CAMPAIGN_RELEVANCE_MAX_CALLS:-200}
      # Investor leads from the comments under sent objects (bot/campaign/leads.py), and dead groups.
      CAMPAIGN_COMMENT_LEADS: ${CAMPAIGN_COMMENT_LEADS:-all}
      CAMPAIGN_COMMENT_MAX_POSTS: ${CAMPAIGN_COMMENT_MAX_POSTS:-15}
      SAFETY_MAX_FACEBOOK_COMMENT_READS_PER_DAY: ${SAFETY_MAX_FACEBOOK_COMMENT_READS_PER_DAY:-40}
      CAMPAIGN_COMMENT_READS_PER_ROUND: ${CAMPAIGN_COMMENT_READS_PER_ROUND:-3}
      CAMPAIGN_COMMENT_POLL_SECONDS: ${CAMPAIGN_COMMENT_POLL_SECONDS:-30}
      CAMPAIGN_LEAD_PEOPLE_MAX: ${CAMPAIGN_LEAD_PEOPLE_MAX:-60}
      CAMPAIGN_LEAD_DAYS: ${CAMPAIGN_LEAD_DAYS:-90}
      OPENROUTER_LEADS_MODEL: ${OPENROUTER_LEADS_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_LEADS_TIMEOUT_SECONDS: ${OPENROUTER_LEADS_TIMEOUT_SECONDS:-30}
      FACEBOOK_GROUP_DEAD_DAYS: ${FACEBOOK_GROUP_DEAD_DAYS:-7}
      # Investor reach across platforms through the search engines (bot/campaign/reach.py).
      INVESTOR_REACH_ENABLED: ${INVESTOR_REACH_ENABLED:-true}
      INVESTOR_REACH_QUERIES_PER_CAMPAIGN: ${INVESTOR_REACH_QUERIES_PER_CAMPAIGN:-16}
      INVESTOR_REACH_QUERIES_PER_TICK: ${INVESTOR_REACH_QUERIES_PER_TICK:-2}
      INVESTOR_REACH_QUERIES_PER_DAY: ${INVESTOR_REACH_QUERIES_PER_DAY:-80}
      INVESTOR_REACH_POLL_SECONDS: ${INVESTOR_REACH_POLL_SECONDS:-20}
      OPENROUTER_REACH_MODEL: ${OPENROUTER_REACH_MODEL:-openai/gpt-4o-mini}
      INVESTOR_REACH_MODEL_QUERIES: ${INVESTOR_REACH_MODEL_QUERIES:-10}
    # `backend` reaches PostgreSQL, the browser and SearXNG; `egress` sends
    # Telegram messages, calls OpenRouter and reads public web pages.
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  searxng:
    # Metasearch for the campaigns' website stage: the official image with
    # docker/searxng/settings.yml (JSON output only, limiter off). No host
    # port: only services on the private backend network reach it; it joins
    # egress to query the search engines. SEARXNG_SECRET may stay empty (a
    # random one is made at start); WEB_SEARCH_PROXY_URL, when set, routes its
    # outgoing requests too.
    image: searxng/searxng:${SEARXNG_IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/bot-searxng/entrypoint.sh"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      WEB_SEARCH_PROXY_URL: ${WEB_SEARCH_PROXY_URL:-}
    volumes:
      - ./docker/searxng:/opt/bot-searxng:ro
    networks: [backend, egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]

  # Optional VPN for the web stage (docs/WEB_SEARCH.md): uncomment, fill the
  # WireGuard values in .env, then set WEB_SEARCH_PROXY_URL=http://gluetun:8888.
  # gluetun:
  #   image: qmcgaw/gluetun:latest
  #   restart: unless-stopped
  #   cap_add: [NET_ADMIN]
  #   devices: ["/dev/net/tun:/dev/net/tun"]
  #   environment:
  #     VPN_SERVICE_PROVIDER: ${GLUETUN_VPN_PROVIDER:-custom}
  #     VPN_TYPE: wireguard
  #     WIREGUARD_PRIVATE_KEY: ${GLUETUN_WIREGUARD_PRIVATE_KEY:-}
  #     WIREGUARD_ADDRESSES: ${GLUETUN_WIREGUARD_ADDRESSES:-}
  #     WIREGUARD_PUBLIC_KEY: ${GLUETUN_WIREGUARD_PUBLIC_KEY:-}
  #     WIREGUARD_ENDPOINT_IP: ${GLUETUN_WIREGUARD_ENDPOINT_IP:-}
  #     WIREGUARD_ENDPOINT_PORT: ${GLUETUN_WIREGUARD_ENDPOINT_PORT:-51820}
  #     HTTPPROXY: "on"
  #     HTTPPROXY_LISTENING_ADDRESS: ":8888"
  #   # `backend`: the campaign-runner and SearXNG reach its proxy; `egress`: the tunnel.
  #   networks: [backend, egress]

  verification:
    # Human-in-the-loop verification (bot/verification). Operators open it as
    # a Telegram Mini App through Caddy at /verify/*; it publishes no host port.
    # Without VERIFICATION_PUBLIC_URL (or LIVE_VIEW_PUBLIC_URL) it stays idle.
    build:
      context: .
      dockerfile: docker/verification.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      VERIFICATION_OWNER_TELEGRAM_ID: ${VERIFICATION_OWNER_TELEGRAM_ID:-}
      VERIFICATION_PUBLIC_URL: ${VERIFICATION_PUBLIC_URL:-}
      LIVE_VIEW_PUBLIC_URL: ${LIVE_VIEW_PUBLIC_URL:-}
      VERIFICATION_TOKEN_MINUTES: ${VERIFICATION_TOKEN_MINUTES:-15}
      VERIFICATION_SESSION_MINUTES: ${VERIFICATION_SESSION_MINUTES:-30}
      VERIFICATION_JOB_HOURS: ${VERIFICATION_JOB_HOURS:-24}
      VERIFICATION_RENOTIFY_MINUTES: ${VERIFICATION_RENOTIFY_MINUTES:-30}
      VERIFICATION_LIVE_MINUTES: ${VERIFICATION_LIVE_MINUTES:-20}
      VERIFICATION_POLL_SECONDS: ${VERIFICATION_POLL_SECONDS:-30}
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
    # `backend` reaches PostgreSQL, the browser and Caddy; `egress` sends the
    # Telegram notices.
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  browser_profiles:
  browser_screenshots:

networks:
  backend:
    internal: true
  # An ordinary bridge network with no published ports. Only services that
  # need outbound HTTPS may join it; PostgreSQL and Redis remain backend-only.
  egress:
  # Caddy alone joins this network so its loopback-published gateway port can
  # accept host traffic while databases remain unreachable from it.
  edge:
