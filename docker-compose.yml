# Local development.
#
# The default `bot` service mirrors production: one container running both
# SearXNG and the bot, exactly as Render will run it.
#
#   docker compose up --build
#
# The `searxng` profile instead runs SearXNG on its own, for when you want to
# iterate on the bot with a plain `python -m bot.main` on the host:
#
#   docker compose --profile searxng-only up searxng
#   SEARXNG_URL=http://127.0.0.1:8888 python -m bot.main

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      # google-chrome-stable (needed only when FACEBOOK_ENABLED=true) is only
      # published for amd64 -- Google does not ship an arm64 build. Pin the
      # platform so this still builds on Apple Silicon; Docker Desktop then runs
      # it under Rosetta (fast, enable "Use Rosetta for x86/amd64 emulation" in
      # Settings > General) or QEMU (slower, the default). On an amd64 host this
      # line is a no-op.
      platforms:
        - linux/amd64
    platform: linux/amd64
    env_file: .env
    environment:
      ENVIRONMENT: docker
      SEARXNG_URL: http://127.0.0.1:8888
      SEARXNG_BIND_ADDRESS: 127.0.0.1
      # Uncomment to let the cache service below be used.
      # SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      # Without this, the container filesystem (and with it the Facebook Chrome
      # profile + the live-view token file) resets on every `docker compose up`
      # after a `down` -- you would have to clear the login checkpoint again on
      # every restart. Bind-mounting ./data keeps FACEBOOK_PROFILE_DIR and
      # FACEBOOK_TOKEN_STORE_PATH (both default to ./data/... inside the
      # container) on the host, surviving container recreation.
      - ./data:/app/data
    ports:
      # Exposed only so you can curl the API while developing. Drop this
      # mapping and SearXNG is unreachable from outside the container.
      - "127.0.0.1:8888:8888"
      # The token-gated proxy in front of the Facebook browser's noVNC view
      # (bot/services/facebook/gate.py), only real when FACEBOOK_ENABLED=true.
      # Loopback here on purpose -- on a VPS, a Tailscale Funnel pointed at this
      # port is what makes the Telegram "Open Facebook" button work from
      # anywhere, without publishing anything yourself (see the README's
      # "Tailscale Funnel setup" section). Harmless when Facebook is disabled:
      # nothing listens on 8090 and the mapping just sits idle. Never publish
      # noVNC's own 6080 or Chrome's CDP port -- this gate is the only
      # intended way in.
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Standalone SearXNG for host-side bot development.
  searxng:
    profiles: ["searxng-only"]
    build:
      context: .
      dockerfile: Dockerfile
      # See the note on the bot service above -- same Dockerfile, same amd64-only
      # Chrome dependency at build time.
      platforms:
        - linux/amd64
    platform: linux/amd64
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-secret-change-me}
    entrypoint: ["granian", "--interface", "wsgi", "--host", "0.0.0.0", "--port", "8888",
                 "searxng.api_only:application"]
    ports:
      - "127.0.0.1:8888:8888"
    restart: unless-stopped

  # Optional result cache. SearXNG works without it; enable by setting
  # SEARXNG_VALKEY_URL on the bot service above.
  valkey:
    profiles: ["cache"]
    image: valkey/valkey:8-alpine
    command: valkey-server --save "" --appendonly no
    restart: unless-stopped
