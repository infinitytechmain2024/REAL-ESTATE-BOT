# Hostinger VPS foundation. Only Caddy has a host-facing port; PostgreSQL and
# Redis are isolated on the internal Docker network. Services that must make
# outbound requests join the separate egress network as well; neither database
# nor Redis ever join an egress-capable network or publish a host port.
name: real-estate-monitor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bot/services/db/migrations:/migrations:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Keep this loopback-only until a DNS name and TLS policy are configured.
      - "127.0.0.1:${CADDY_HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]

  telegram:
    build:
      context: .
      dockerfile: docker/telegram-control.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
      # Empty is allowed but refuses every state-changing command.
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      # Tunables read by bot/control_plane/settings.py; defaults match it.
      TELEGRAM_CONFIRMATION_TTL_SECONDS: ${TELEGRAM_CONFIRMATION_TTL_SECONDS:-300}
      TELEGRAM_MAX_VOICE_MB: ${TELEGRAM_MAX_VOICE_MB:-20}
      ORCHESTRA_COMMAND_LEASE_SECONDS: ${ORCHESTRA_COMMAND_LEASE_SECONDS:-30}
      ORCHESTRA_POLL_SECONDS: ${ORCHESTRA_POLL_SECONDS:-1}
      ORCHESTRA_STALE_BATCH_SECONDS: ${ORCHESTRA_STALE_BATCH_SECONDS:-900}
      FASTER_WHISPER_MODEL: ${FASTER_WHISPER_MODEL:-small}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-cpu}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_models:/models
    # `backend` reaches PostgreSQL/Redis; `egress` is required for Telegram's
    # long polling API. It does not publish a host port.
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  worker:
    profiles: [future]
    image: alpine:3.20
    command: ["sh", "-c", "echo 'controlled acquisition worker placeholder'; sleep infinity"]
    networks: [backend]

  browser:
    build:
      context: .
      dockerfile: docker/browser-session.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      BROWSER_PROFILE_ROOT: /profiles
      BROWSER_SCREENSHOT_ROOT: /screenshots
      BROWSER_LEASE_SECONDS: ${BROWSER_LEASE_SECONDS:-120}
      BROWSER_LEASE_RENEW_SECONDS: ${BROWSER_LEASE_RENEW_SECONDS:-30}
      BROWSER_IDLE_SECONDS: ${BROWSER_IDLE_SECONDS:-300}
    volumes:
      - browser_profiles:/profiles
      - browser_screenshots:/screenshots
    # No published ports, including noVNC: during an operator login session
    # (scripts/browser_login.sh) it is reached over an SSH tunnel to this
    # container's bridge address, and nothing listens outside a session.
    # Chromium needs outbound HTTPS while the session API remains reachable
    # only by services on the private backend network.
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    shm_size: 1gb

  facebook-collector:
    profiles: [collector]
    build:
      context: .
      dockerfile: docker/facebook-collector.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      # Validated by the one-shot worker at runtime; keeping this optional here
      # lets ordinary `docker compose config` and non-collector services start.
      FACEBOOK_BATCH_ID: ${FACEBOOK_BATCH_ID:-}
      FACEBOOK_COLLECTOR_MAX_GROUPS: ${FACEBOOK_COLLECTOR_MAX_GROUPS:-20}
      FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP: ${FACEBOOK_COLLECTOR_MAX_POSTS_PER_GROUP:-15}
      FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS: ${FACEBOOK_COLLECTOR_GROUP_TIMEOUT_SECONDS:-90}
      FACEBOOK_COLLECTOR_PAUSE_MIN_SECONDS: ${FACEBOOK_COLLECTOR_PAUSE_MIN_SECONDS:-4}
      FACEBOOK_COLLECTOR_PAUSE_MAX_SECONDS: ${FACEBOOK_COLLECTOR_PAUSE_MAX_SECONDS:-9}
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  agent-reach:
    # Controlled, one-shot public-page reader. It is deliberately profile-gated
    # so upstream Agent Reach is never installed or invoked by this stack.
    profiles: [agent-reach]
    build:
      context: .
      dockerfile: docker/agent-reach.Dockerfile
    depends_on:
      browser:
        condition: service_started
    environment:
      BROWSER_SESSION_URL: http://browser:8090
      BROWSER_SESSION_API_TOKEN: ${BROWSER_SESSION_API_TOKEN:?set BROWSER_SESSION_API_TOKEN in .env}
      AGENT_REACH_TASK_JSON: ${AGENT_REACH_TASK_JSON:-}
      AGENT_REACH_MAX_PAGES: ${AGENT_REACH_MAX_PAGES:-5}
      AGENT_REACH_MAX_EXECUTION_SECONDS: ${AGENT_REACH_MAX_EXECUTION_SECONDS:-120}
      AGENT_REACH_PAGE_TIMEOUT_SECONDS: ${AGENT_REACH_PAGE_TIMEOUT_SECONDS:-30}
      # Must remain false: no upstream CLI/shell/tool installation is allowed.
      AGENT_REACH_UPSTREAM_ENABLED: "false"
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  scrapling-connector:
    # One-shot HTTP-first public website reader. It has no browser profile,
    # browser API token, shell tool, or crawler capability.
    profiles: [scrapling]
    build:
      context: .
      dockerfile: docker/scrapling-connector.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SCRAPLING_RUN_ID: ${SCRAPLING_RUN_ID:-}
      SCRAPLING_CONNECTOR_MAX_RUNTIME_SECONDS: ${SCRAPLING_CONNECTOR_MAX_RUNTIME_SECONDS:-45}
      SCRAPLING_CONNECTOR_REQUEST_TIMEOUT_SECONDS: ${SCRAPLING_CONNECTOR_REQUEST_TIMEOUT_SECONDS:-20}
      SCRAPLING_CONNECTOR_MAX_CONTENT_BYTES: ${SCRAPLING_CONNECTOR_MAX_CONTENT_BYTES:-1500000}
      SCRAPLING_CONNECTOR_MAX_CONTENT_CHARS: ${SCRAPLING_CONNECTOR_MAX_CONTENT_CHARS:-120000}
      SCRAPLING_CONNECTOR_USER_AGENT: ${SCRAPLING_CONNECTOR_USER_AGENT:-RealEstateResearchBot/0.1}
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  whisper_models:
  browser_profiles:
  browser_screenshots:

networks:
  backend:
    internal: true
  # An ordinary bridge network with no published ports. Only services that
  # need outbound HTTPS may join it; PostgreSQL and Redis remain backend-only.
  egress:
  # Caddy alone joins this network so its loopback-published gateway port can
  # accept host traffic while databases remain unreachable from it.
  edge:
