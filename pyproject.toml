[project]
name = "real-estate-bot"
version = "0.1.0"
description = "Telegram-controlled real-estate and investor research campaigns"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# legacy/ is the retired standalone bot (incl. the vendored SearXNG snapshot):
# kept for reference, not deployed, not linted.
extend-exclude = ["legacy"]

[tool.ruff.lint]
# BLE001 is enabled so that every broad `except Exception` has to be
# justified with a noqa comment saying why swallowing is correct there.
select = ["E", "F", "B", "BLE", "SIM", "UP", "I", "RUF"]
ignore = [
    "E501",    # long lines are caught by the formatter, not worth failing on
    # The user-facing strings are Russian, so Cyrillic characters in string
    # literals are correct, not a homoglyph attack.
    "RUF001",
    "RUF002",
    "RUF003",
]

# Package __init__ files re-export and import providers for their registration
# side effects; those lines carry their own `# noqa: F401`.


[tool.pytest.ini_options]
testpaths = ["tests"]
# legacy/tests belong to the retired standalone bot and need its code; see legacy/README.md.
norecursedirs = ["legacy", ".git", "node_modules"]
# Every test here is async; opting in per-test would be pure ceremony.
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
