# The smallest workflow that stays green: lint, import walk, and the unit suite.
# The campaign stack is the only thing deployed; the retired standalone bot
# lives in legacy/ and is neither linted nor tested here.
#
# Deliberately absent, so their absence reads as a decision rather than an
# oversight:
#
#   - `ruff format --check`: the tree predates the current formatter and 165
#     files in bot/ and tests/ would fail it today. Reformatting them is its
#     own commit, not a condition for having CI at all.
#   - anything touching Chrome, Xvfb or the real noVNC: none of it fits in a
#     CI runner. The deploy is still verified by hand on the VPS -- see
#     "Деплой на VPS" in README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt holds the pinned ruff, so the version CI uses
        # and the version `make lint` uses cannot drift apart.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Byte-compile and import every module
        # Healthcheck modules probe their service at import time and are skipped.
        run: make check-imports BIN="$(dirname "$(which python)")"

      - name: Golden tests (web search queries)
        run: python -m pytest -q tests/test_web_search_queries.py

      - name: Unit tests
        # PostgreSQL-backed tests skip without their *_TEST_DATABASE_URL; the
        # `integration` job below runs them against a real database.
        run: python -m pytest -q

  integration:
    # The flows that cross service boundaries, on a real PostgreSQL with every
    # migration: command -> Orchestra -> worker -> analysis -> digest,
    # challenge -> verification -> resume, quotas and breakers. Facebook,
    # OpenRouter and Telegram are stand-ins; see tests/test_system_integration.py.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: monitoring_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d monitoring_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYSTEM_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/monitoring_test
      VERIFICATION_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/monitoring_test
      ORCHESTRA_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/monitoring_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Integration tests (PostgreSQL)
        run: >-
          python -m pytest -q
          tests/test_system_integration.py
          tests/test_verification_postgres.py
          tests/test_orchestra_postgres.py
          tests/test_operator_access.py
          tests/test_image_imports.py
