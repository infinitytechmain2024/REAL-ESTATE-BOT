# The smallest workflow that would have caught something real. The token gate
# and the noVNC WebSocket path in front of it held three separate faults until
# someone actually ran them (see scripts/gate_probe.py); a green tick on the
# other two steps means the tree still imports and still lints.
#
# Deliberately absent, so their absence reads as a decision rather than an
# oversight:
#
#   - `ruff format --check`: the tree predates the current formatter and 16
#     files would fail it today. Reformatting them is its own commit, not a
#     condition for having CI at all.
#   - the import walk from `make check-imports`: it needs every runtime
#     dependency to import cleanly on a machine nobody has run it on yet.
#     Worth adding once someone has watched it pass. (It has now been watched
#     to pass locally; what it would not have caught is the vendored snapshot,
#     because `searxng/` is outside the walk -- hence the separate step below.)
#   - anything touching Chrome, Xvfb or the real noVNC: none of it fits in a
#     CI runner, and pretending otherwise would turn a green tick into a
#     claim this cannot support. The deploy is still verified by hand on the
#     VPS -- see "Деплой на VPS" in README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt holds the pinned ruff, so the version CI uses
        # and the version `make lint` uses cannot drift apart.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Vendor snapshot
        # First, because it needs nothing installed and its failure explains
        # every later one: without searx/data the whole search backend is dead
        # on a fresh clone, which is exactly how this shipped once already.
        run: python scripts/check_vendor.py

      - name: Lint
        run: ruff check .

      - name: Byte-compile
        run: python -m compileall -q bot scripts

      - name: Gate probe
        # Needs no browser: it stands up stand-ins for noVNC and websockify
        # and drives the real gate the way a phone would.
        run: python scripts/gate_probe.py

      - name: Pipeline probe
        # The Facebook source reads markup that changes without notice, so it
        # breaking is the expected case. This is what keeps that from costing
        # a search anything.
        run: python scripts/pipeline_probe.py

  integration:
    # The flows that cross service boundaries, on a real PostgreSQL with every
    # migration: command -> Orchestra -> worker -> analysis -> digest,
    # challenge -> verification -> resume, quotas and breakers. Facebook,
    # OpenRouter and Telegram are stand-ins; see tests/test_system_integration.py.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: monitoring_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d monitoring_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYSTEM_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/monitoring_test
      VERIFICATION_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/monitoring_test
      ORCHESTRA_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/monitoring_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Integration tests (PostgreSQL)
        run: >-
          python -m pytest -q
          tests/test_system_integration.py
          tests/test_verification_postgres.py
          tests/test_orchestra_postgres.py
          tests/test_operator_access.py
