# SearXNG configuration for REAL-ESTATE-BOT
#
# This file is layered on top of the upstream `searx/settings.yml` via
# `use_default_settings`, so it only contains what we deliberately change.
# It is selected with SEARXNG_SETTINGS_PATH=/app/searxng/settings/settings.yml
#
# Docs: https://docs.searxng.org/admin/settings/index.html

use_default_settings:
  engines:
    # Only these engines survive; everything else upstream ships is dropped.
    keep_only:
      - google
      - bing
      - duckduckgo
      - brave
      - startpage
      - mojeek
      - qwant
      - wikipedia
      - wikidata

general:
  debug: false
  instance_name: "real-estate-bot-search"
  # Nothing here is user facing, so metrics only cost memory.
  enable_metrics: true
  contact_url: false
  donation_url: false
  privacypolicy_url: false

search:
  # ---------------------------------------------------------------------
  # THE IMPORTANT ONE: upstream ships `formats: [html]`, which makes
  # /search?format=json return HTTP 403. The bot needs JSON and nothing
  # else, so HTML result rendering is switched off entirely.
  # ---------------------------------------------------------------------
  formats:
    - json
  safe_search: 0
  # Autocompletion is a UI feature and costs an extra upstream request.
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "auto"
  # Engines are transient: back off briefly on failure instead of dropping
  # them for minutes, because a single bot query fans out to all of them.
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120

server:
  port: 8888
  # Overridden by ${SEARXNG_BIND_ADDRESS}. In the single-container setup the
  # API is only reachable from the bot process on loopback.
  bind_address: "127.0.0.1"
  base_url: false
  # No public exposure -> no rate limiting or bot detection against ourselves.
  limiter: false
  public_instance: false
  image_proxy: false
  # Overridden by ${SEARXNG_SECRET}; the container refuses to start with the
  # upstream placeholder value (see entrypoint.sh).
  secret_key: "change-me-in-env"
  method: "GET"

# Optional result cache. Enabled by setting ${SEARXNG_VALKEY_URL}; without it
# SearXNG runs fine, just without cross-request caching.
valkey:
  url: false

ui:
  # The web UI is unreachable (see ../api_only.py), these values only keep the
  # Flask app happy at start-up.
  static_use_hash: false
  default_locale: "en"
  query_in_title: false

outgoing:
  # Slightly more generous than upstream's 3.0s: the bot fans out several
  # queries in parallel and would rather wait than lose an engine.
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

# Plugins that only make sense with a browser in front of them are off.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: false
  searx.plugins.hash_plugin.SXNGPlugin:
    active: false
  searx.plugins.self_info.SXNGPlugin:
    active: false
  searx.plugins.unit_converter.SXNGPlugin:
    active: false
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false
  searx.plugins.hostnames.SXNGPlugin:
    active: false
  searx.plugins.time_zone.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    # Keep this one: it strips utm_* &c. from result URLs, which directly
    # improves our url_hash de-duplication.
    active: true

engines:
  # `keep_only` above preserves each engine's upstream `disabled` flag, and
  # google/bing/qwant/mojeek ship disabled. Re-enable them explicitly and give
  # the general-purpose engines more weight than the encyclopaedic ones.
  - name: google
    disabled: false
    weight: 1.5
    timeout: 6.0

  - name: bing
    disabled: false
    weight: 1.3
    timeout: 6.0

  - name: duckduckgo
    disabled: false
    weight: 1.3
    timeout: 6.0

  - name: brave
    disabled: false
    weight: 1.1
    timeout: 6.0

  - name: startpage
    disabled: false
    weight: 1.0
    timeout: 7.0

  - name: mojeek
    disabled: false
    weight: 0.8
    timeout: 6.0

  - name: qwant
    disabled: false
    weight: 0.8
    timeout: 6.0

  - name: wikipedia
    disabled: false
    weight: 0.4

  - name: wikidata
    disabled: false
    weight: 0.4
